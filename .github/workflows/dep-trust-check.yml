name: Dependency trust validation

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "**/requirements*.txt"
      - "**/package-lock.json"
      - "**/Cargo.lock"
      - "**/go.sum"
      - "**/pyproject.toml"
      - "**/package.json"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read        # checkout only — no write access needed

jobs:
  trust-check:
    name: Gate 1-5 validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install strace (Gate 5 sandbox backend)
        run: sudo apt-get install -y strace

      - name: Install syft (Gate 4 SBOM backend)
        run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Install OSS Trust Framework
        run: |
          pip install "git+https://github.com/chrisgillham/oss-trust-framework.git"
          oss-trust --version

      - name: Validate httpx
        run: |
          oss-trust check \
            --package httpx \
            --version 0.28.1 \
            --ecosystem PyPI \
            --github-repo encode/httpx \
            --github-token "${{ secrets.GITHUB_TOKEN }}" \
            --output json | tee trust-httpx.json

      - name: Validate cryptography
        run: |
          oss-trust check \
            --package cryptography \
            --version 48.0.0 \
            --ecosystem PyPI \
            --github-repo pyca/cryptography \
            --github-token "${{ secrets.GITHUB_TOKEN }}" \
            --output json | tee trust-cryptography.json

      - name: Validate pydantic
        run: |
          oss-trust check \
            --package pydantic \
            --version 2.13.4 \
            --ecosystem PyPI \
            --github-repo pydantic/pydantic \
            --github-token "${{ secrets.GITHUB_TOKEN }}" \
            --output json | tee trust-pydantic.json

      - name: Validate rich
        run: |
          oss-trust check \
            --package rich \
            --version 15.0.0 \
            --ecosystem PyPI \
            --github-repo Textualize/rich \
            --github-token "${{ secrets.GITHUB_TOKEN }}" \
            --output json | tee trust-rich.json

      - name: Validate click
        run: |
          oss-trust check \
            --package click \
            --version 8.4.1 \
            --ecosystem PyPI \
            --github-repo pallets/click \
            --github-token "${{ secrets.GITHUB_TOKEN }}" \
            --output json | tee trust-click.json

      - name: Validate pyyaml
        run: |
          oss-trust check \
            --package pyyaml \
            --version 6.0.3 \
            --ecosystem PyPI \
            --github-repo yaml/pyyaml \
            --github-token "${{ secrets.GITHUB_TOKEN }}" \
            --output json | tee trust-pyyaml.json

      - name: Gate 5 sandbox backend status
        run: |
          python -c "
          from oss_trust_framework.sandbox.runner import _detect_backend, SandboxBackend
          backend = _detect_backend()
          print(f'Gate 5 backend: {backend.value}')
          if backend == SandboxBackend.STRACE:
              print('Behavioral sandbox: ACTIVE via strace')
          elif backend == SandboxBackend.GVISOR:
              print('Behavioral sandbox: ACTIVE via gVisor (strongest)')
          elif backend == SandboxBackend.AUDIT:
              print('Behavioral sandbox: LIMITED via Python audit hooks')
          else:
              print('WARNING: No sandbox backend available - Gate 5 inactive')
          "

      - name: Upload trust reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trust-reports
          path: trust-*.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Trust summary
        if: always()
        run: |
          python -c "
          import json, glob, sys
          reports = glob.glob('trust-*.json')
          if not reports:
              print('No trust reports generated.')
              sys.exit(0)
          results = []
          for r in sorted(reports):
              try:
                  data = json.load(open(r))
                  pkg     = data.get('package', r)
                  ver     = data.get('version', '')
                  outcome = data.get('outcome', 'unknown')
                  gates   = {g['gate']: g.get('passed') for g in data.get('gates', [])}
                  results.append((pkg, ver, outcome, gates))
              except Exception:
                  pass

          print()
          print('  Trust validation summary')
          print('  ' + '=' * 60)
          failed = []
          for pkg, ver, outcome, gates in results:
              icon = 'v' if outcome == 'approved' else '!'

              # Gate 2.5 is reported as three individual gates
              gate25_gates = ['orphan_commits', 'workflow_permissions', 'pr_provenance']
              gate25_results = [gates.get(g) for g in gate25_gates if g in gates]
              if gate25_results:
                  gate25_status = 'ACTIVE' if all(v is not None for v in gate25_results) else 'partial'
              else:
                  gate25_status = 'skipped (no github-repo)'

              g5_status = 'ACTIVE' if gates.get('sandbox') is not None else 'skipped'

              print(f'  [{icon}] {pkg}=={ver}  ->  {outcome}')
              print(f'       Gate 2.5 (orphan/workflow/pr):  {gate25_status}')
              print(f'       Gate 5   (behavioral sandbox):  {g5_status}')
              if outcome not in ('approved', 'pass'):
                  failed.append(pkg)

          print()
          if failed:
              print(f'  FAILED: {failed}')
              sys.exit(1)
          else:
              print('  All packages approved.')
          "
