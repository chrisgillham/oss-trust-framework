name: Dependency trust validation

on:
  pull_request:
    paths:
      - "**/requirements*.txt"
      - "**/package-lock.json"
      - "**/Cargo.lock"
      - "**/go.sum"
      - "**/pyproject.toml"
      - "**/package.json"

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  detect-changes:
    name: Detect dependency changes
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.diff.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract changed packages
        id: diff
        run: |
          # Parse lock file diffs to extract new/updated package+version pairs
          # Output format: JSON array of {package, version, ecosystem} objects
          python scripts/extract_dep_changes.py \
            --base ${{ github.event.pull_request.base.sha }} \
            --head ${{ github.event.pull_request.head.sha }} \
            >> "$GITHUB_OUTPUT"

  validate:
    name: Validate ${{ matrix.package }}@${{ matrix.version }}
    needs: detect-changes
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.packages != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect-changes.outputs.packages) }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install oss-trust-framework
        run: pip install oss-trust-framework

      - name: Run trust pipeline
        id: trust
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OSV_API_KEY: ${{ secrets.OSV_API_KEY }}
          SIEM_HEC_ENDPOINT: ${{ secrets.SIEM_HEC_ENDPOINT }}
          SIEM_HEC_TOKEN: ${{ secrets.SIEM_HEC_TOKEN }}
        run: |
          oss-trust check \
            --package "${{ matrix.package }}" \
            --version "${{ matrix.version }}" \
            --ecosystem "${{ matrix.ecosystem }}" \
            --output json > trust-result.json

          echo "outcome=$(jq -r .outcome trust-result.json)" >> "$GITHUB_OUTPUT"
          echo "message=$(jq -r .message trust-result.json)"  >> "$GITHUB_OUTPUT"

      # Upload the result so the comment step can read it even if a prior
      # matrix leg failed (fail-fast: false means legs run independently).
      - name: Upload trust result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trust-result-${{ matrix.ecosystem }}-${{ matrix.package }}-${{ matrix.version }}
          path: trust-result.json
          retention-days: 7

      # Block the job explicitly so the PR check goes red on blocked/quarantined.
      - name: Enforce trust outcome
        if: >
          steps.trust.outputs.outcome == 'blocked' ||
          steps.trust.outputs.outcome == 'quarantined'
        run: |
          echo "::error ::Trust check failed for ${{ matrix.package }}@${{ matrix.version }}: ${{ steps.trust.outputs.message }}"
          exit 1

      # Post (or update) a PR comment — script lives in .github/scripts to
      # avoid embedding multi-line JS with pipe characters inside YAML.
      - name: Comment on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fn = require('./.github/scripts/post-trust-comment.js');
            await fn({ github, context });
