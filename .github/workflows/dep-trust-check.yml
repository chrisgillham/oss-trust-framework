name: Dependency trust validation

on:
  pull_request:
    paths:
      - "**/requirements*.txt"
      - "**/package-lock.json"
      - "**/Cargo.lock"
      - "**/go.sum"
      - "**/pyproject.toml"
      - "**/package.json"

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  detect-changes:
    name: Detect dependency changes
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.diff.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract changed packages
        id: diff
        run: |
          # Parse lock file diffs to extract new/updated package+version pairs
          # Output format: JSON array of {package, version, ecosystem} objects
          python scripts/extract_dep_changes.py \
            --base ${{ github.event.pull_request.base.sha }} \
            --head ${{ github.event.pull_request.head.sha }} \
            >> "$GITHUB_OUTPUT"

  validate:
    name: Validate ${{ matrix.package }}@${{ matrix.version }}
    needs: detect-changes
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.packages != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect-changes.outputs.packages) }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install oss-trust-framework
        run: pip install oss-trust-framework

      - name: Run trust pipeline
        id: trust
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OSV_API_KEY: ${{ secrets.OSV_API_KEY }}
          SIEM_HEC_ENDPOINT: ${{ secrets.SIEM_HEC_ENDPOINT }}
          SIEM_HEC_TOKEN: ${{ secrets.SIEM_HEC_TOKEN }}
        run: |
          oss-trust check \
            --package "${{ matrix.package }}" \
            --version "${{ matrix.version }}" \
            --ecosystem "${{ matrix.ecosystem }}" \
            --output json > trust-result.json

          echo "outcome=$(jq -r .outcome trust-result.json)" >> "$GITHUB_OUTPUT"
          echo "message=$(jq -r .message trust-result.json)"  >> "$GITHUB_OUTPUT"

      # Upload the result so the comment step can read it even if a prior
      # matrix leg failed (fail-fast: false means legs run independently).
      - name: Upload trust result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trust-result-${{ matrix.ecosystem }}-${{ matrix.package }}-${{ matrix.version }}
          path: trust-result.json
          retention-days: 7

      # Block the job explicitly so the PR check goes red on blocked/quarantined.
      - name: Enforce trust outcome
        if: >
          steps.trust.outputs.outcome == 'blocked' ||
          steps.trust.outputs.outcome == 'quarantined'
        run: |
          echo "::error ::Trust check failed for ${{ matrix.package }}@${{ matrix.version }}: ${{ steps.trust.outputs.message }}"
          exit 1

      # Post (or update) a PR comment — script lives in .github/scripts to
      # avoid embedding multi-line JS with pipe characters inside YAML.
      - name: Comment on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fn = require('./.github/scripts/post-trust-comment.js');
            await fn({ github, context });

  # ── Quorum override job ───────────────────────────────────────────────────
  # Runs only when validate fails due to a blocked or quarantined package.
  # Downloads the trust-result artifact, then runs the Discord quorum engine.
  # The job polls Discord for reactions until simple majority or deadline.
  # Exit 0 (approved) marks the PR check green; exit 1 keeps it red.
  #
  # Required secrets:
  #   DISCORD_BOT_TOKEN       Bot token (SEND_MESSAGES, ADD_REACTIONS,
  #                           READ_MESSAGE_HISTORY, MANAGE_MESSAGES, EMBED_LINKS)
  #   DISCORD_CHANNEL_ID      Channel ID for quorum embeds
  #   DISCORD_GUILD_ID        Server (guild) ID
  #   SHEETS_CREDENTIALS      Base64-encoded Google service account JSON
  #                           (encode with: base64 -w0 service-account.json)
  #   SHEETS_SPREADSHEET_ID   Spreadsheet ID for audit log
  #
  # Required repo file:
  #   .github/quorum-config.json   Members array + threshold + deadlineHours

  quorum-override:
    name: Quorum override — ${{ matrix.package }}@${{ matrix.version }}
    needs: [detect-changes, validate]
    runs-on: ubuntu-latest
    # Only trigger when validate has failed AND packages were detected.
    # result == 'failure' is set when Enforce trust outcome exits 1.
    if: |
      needs.validate.result == 'failure' &&
      needs.detect-changes.outputs.packages != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect-changes.outputs.packages) }}

    steps:
      - uses: actions/checkout@v4

      - name: Download trust result artifact
        uses: actions/download-artifact@v4
        with:
          name: >-
            trust-result-${{ matrix.ecosystem }}-${{ matrix.package }}-${{ matrix.version }}
          path: .

      # Skip packages that passed trust validation — only run quorum on
      # blocked/quarantined outcomes.
      - name: Check if quorum is needed
        id: check
        run: |
          outcome=$(jq -r .outcome trust-result.json)
          echo "outcome=${outcome}" >> "$GITHUB_OUTPUT"
          if [[ "$outcome" == "blocked" || "$outcome" == "quarantined" ]]; then
            echo "needed=true"  >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run quorum engine
        if: steps.check.outputs.needed == 'true'
        env:
          # Discord
          DISCORD_BOT_TOKEN:   ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID:  ${{ secrets.DISCORD_CHANNEL_ID }}
          DISCORD_GUILD_ID:    ${{ secrets.DISCORD_GUILD_ID }}
          # Google Sheets audit log
          SHEETS_CREDENTIALS:     ${{ secrets.SHEETS_CREDENTIALS }}
          SHEETS_SPREADSHEET_ID:  ${{ secrets.SHEETS_SPREADSHEET_ID }}
          # GitHub context (passed explicitly so the script can comment on the PR)
          GITHUB_TOKEN:    ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER:       ${{ github.event.pull_request.number }}
          GITHUB_RUN_ID:   ${{ github.run_id }}
          # Optional runtime overrides (can also be set in quorum-config.json)
          # QUORUM_MEMBERS:         "111,222,333"
          # QUORUM_THRESHOLD:       "0.5"
          # QUORUM_DEADLINE_HOURS:  "24"
        run: node .github/scripts/quorum-engine.js
        # Timeout slightly under Actions job limit; quorum deadline should be
        # shorter than this. Default 24 h deadline → set job timeout to 25 h.
        timeout-minutes: 1500
