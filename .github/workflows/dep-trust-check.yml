name: Dependency trust validation

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "**/requirements*.txt"
      - "**/package-lock.json"
      - "**/Cargo.lock"
      - "**/go.sum"
      - "**/pyproject.toml"
      - "**/package.json"

jobs:
  trust-check:
    name: Gate 1-5 validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install strace (Gate 5 sandbox backend)
        run: sudo apt-get install -y strace

      - name: Install OSS Trust Framework
        run: |
          pip install "git+https://github.com/chrisgillham/oss-trust-framework.git"
          oss-trust --version

      - name: Validate httpx
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          oss-trust check \
            --package httpx \
            --version 0.28.1 \
            --ecosystem PyPI \
            --github-repo encode/httpx \
            --output json | tee trust-httpx.json
          echo "httpx outcome: $(python -c "import json; print(json.load(open('trust-httpx.json'))['outcome'])" 2>/dev/null || echo 'see log')"

      - name: Validate cryptography
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          oss-trust check \
            --package cryptography \
            --version 48.0.0 \
            --ecosystem PyPI \
            --github-repo pyca/cryptography \
            --output json | tee trust-cryptography.json
          echo "cryptography outcome: $(python -c "import json; print(json.load(open('trust-cryptography.json'))['outcome'])" 2>/dev/null || echo 'see log')"

      - name: Validate pydantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          oss-trust check \
            --package pydantic \
            --version 2.13.4 \
            --ecosystem PyPI \
            --github-repo pydantic/pydantic \
            --output json | tee trust-pydantic.json
          echo "pydantic outcome: $(python -c "import json; print(json.load(open('trust-pydantic.json'))['outcome'])" 2>/dev/null || echo 'see log')"

      - name: Validate rich
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          oss-trust check \
            --package rich \
            --version 15.0.0 \
            --ecosystem PyPI \
            --github-repo Textualize/rich \
            --output json | tee trust-rich.json
          echo "rich outcome: $(python -c "import json; print(json.load(open('trust-rich.json'))['outcome'])" 2>/dev/null || echo 'see log')"

      - name: Validate click
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          oss-trust check \
            --package click \
            --version 8.4.1 \
            --ecosystem PyPI \
            --github-repo pallets/click \
            --output json | tee trust-click.json
          echo "click outcome: $(python -c "import json; print(json.load(open('trust-click.json'))['outcome'])" 2>/dev/null || echo 'see log')"

      - name: Validate pyyaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          oss-trust check \
            --package pyyaml \
            --version 6.0.3 \
            --ecosystem PyPI \
            --github-repo yaml/pyyaml \
            --output json | tee trust-pyyaml.json
          echo "pyyaml outcome: $(python -c "import json; print(json.load(open('trust-pyyaml.json'))['outcome'])" 2>/dev/null || echo 'see log')"

      - name: Gate 5 — sandbox backend status
        run: |
          python -c "
          from oss_trust_framework.sandbox.runner import _detect_backend, SandboxBackend
          backend = _detect_backend()
          print(f'Gate 5 backend: {backend.value}')
          if backend == SandboxBackend.STRACE:
              print('Behavioral sandbox: ACTIVE via strace')
          elif backend == SandboxBackend.GVISOR:
              print('Behavioral sandbox: ACTIVE via gVisor (strongest)')
          elif backend == SandboxBackend.AUDIT:
              print('Behavioral sandbox: LIMITED via Python audit hooks')
          else:
              print('WARNING: No sandbox backend available — Gate 5 inactive')
          "

      - name: Upload trust reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trust-reports
          path: trust-*.json
          retention-days: 30

      - name: Trust summary
        if: always()
        run: |
          python -c "
          import json, glob, sys
          reports = glob.glob('trust-*.json')
          results = []
          for r in sorted(reports):
              try:
                  data = json.load(open(r))
                  pkg = data.get('package', r)
                  ver = data.get('version', '')
                  outcome = data.get('outcome', 'unknown')
                  results.append((pkg, ver, outcome))
              except Exception:
                  pass

          print()
          print('  Trust validation summary')
          print('  ' + '=' * 50)
          failed = []
          for pkg, ver, outcome in results:
              icon = 'v' if outcome == 'approved' else '!'
              print(f'  [{icon}] {pkg}=={ver}  ->  {outcome}')
              if outcome not in ('approved', 'pass'):
                  failed.append(pkg)

          print()
          if failed:
              print(f'  FAILED: {failed}')
              sys.exit(1)
          else:
              print('  All packages approved.')
          "
