name: OSS Trust Check

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'package.json'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'Cargo.toml'
      - 'Gemfile.lock'
      - 'framework_deps.txt'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  trust-check:
    name: Gate 1 — Dependency Trust Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install oss-trust-framework
        run: |
          pip install -q "oss-trust-framework==0.8.0"
          oss-trust --version

      - name: Run trust check
        id: check
        run: |
          set +e
          
          echo "Running: oss-trust check-all --no-interactive --output json"
          oss-trust check-all --no-interactive --output json 2>&1 | tee trust_report.json
          CHECK_EXIT=${PIPESTATUS[0]}
          
          echo "Exit code: $CHECK_EXIT"
          echo "File size: $(wc -c < trust_report.json 2>/dev/null || echo 'FILE NOT FOUND')"
          
          set -e
          echo "exit_code=$CHECK_EXIT" >> $GITHUB_OUTPUT

      - name: Format results
        if: always()
        run: |
          if [ -f trust_report.json ]; then
            echo "## 🔍 OSS Trust Check Results" > pr_comment.txt
            echo "" >> pr_comment.txt
            echo '```json' >> pr_comment.txt
            cat trust_report.json >> pr_comment.txt
            echo '```' >> pr_comment.txt
          else
            echo "# ❌ No JSON file" > pr_comment.txt
            echo "trust_report.json was not created" >> pr_comment.txt
          fi

      - name: Post comment
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let comment = '❌ No results';
            try {
              comment = fs.readFileSync('pr_comment.txt', 'utf8');
            } catch (e) {}
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment,
            });

      - name: Check status
        run: |
          EXIT_CODE=${{ steps.check.outputs.exit_code }}
          if [ "$EXIT_CODE" = "0" ]; then
            echo "✅ All dependencies approved"
            exit 0
          else
            echo "⚠️ Some dependencies need review"
            exit 1
          fi
