name: OSS Trust Check

# Run on every pull request — including Dependabot's automatic upgrade PRs
on:
  pull_request:
    branches: [ main ]
    paths:
      # Only trigger when dependency files change — no point running on docs edits
      - 'package.json'
      - 'package-lock.json'

  # Also allow manual runs from the Actions tab
  workflow_dispatch:

jobs:
  oss-trust-check:
    name: Gate 1 — Dependency Trust Check
    runs-on: ubuntu-latest

    # Grant read access to repo contents; write access to post PR comments
    permissions:
      contents: read
      pull-requests: write

    steps:
      # ── 1. Check out the PR branch (the proposed upgrade) ──────────────────
      - name: Checkout PR branch
        uses: actions/checkout@v4

      # ── 2. Set up Python for oss-trust-framework ───────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 3. Check out oss-trust-framework from your repo ────────────────────
      #    This clones your framework into a sibling directory so check_all.py
      #    can find package.json via its relative path resolution
      - name: Checkout oss-trust-framework
        uses: actions/checkout@v4
        with:
          repository: chrisgillham/oss-trust-framework
          path: oss-trust-framework
          # If the repo is private, add a token:
          # token: ${{ secrets.OSS_TRUST_TOKEN }}

      # ── 4. Install oss-trust-framework and its dependencies ────────────────
      - name: Install oss-trust-framework
        working-directory: oss-trust-framework
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # ── 5. Run the trust check against the PR's package.json ───────────────
      - name: Run OSS Trust Check
        id: trust_check
        working-directory: ${{ github.workspace }}
        run: |
          # Run check_all.py from the framework against this repo's package.json
          # Capture output for the PR comment step
          python oss-trust-framework/check_all.py 2>&1 | tee trust_check_output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      # ── 6. Post results as a PR comment ────────────────────────────────────
      - name: Post trust check results to PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('trust_check_output.txt', 'utf8');
            const passed = !output.includes('BLOCK') && !output.includes('HOLD') && !output.includes('ERROR');
            const icon = passed ? '✅' : '❌';
            const status = passed ? 'PASSED' : 'ACTION REQUIRED';

            const body = [
              `## ${icon} OSS Trust Framework — ${status}`,
              '',
              '**Gate 1 dependency trust check** ran against the packages in this PR.',
              '',
              '```',
              output.slice(-3000),   // last 3000 chars to stay under comment limits
              '```',
              '',
              passed
                ? '_All packages passed age and allowlist checks. Safe to merge from a supply chain perspective._'
                : '_One or more packages did not pass. Review the output above before merging._',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      # ── 7. Fail the workflow if trust check failed ─────────────────────────
      #    This blocks the PR merge if branch protection requires this check
      - name: Enforce trust check result
        if: steps.trust_check.outputs.exit_code != '0'
        run: |
          echo "OSS Trust Check failed — see PR comment for details."
          exit 1
