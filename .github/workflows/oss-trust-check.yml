name: OSS Trust Check

# Run on every pull request — including Dependabot's automatic upgrade PRs
on:
  pull_request:
    branches: [ main ]
    paths:
      # Trigger on any dependency manifest or lockfile change across all
      # ecosystems the framework supports (npm, PyPI, Cargo, Ruby, .NET)
      - 'package.json'
      - 'package-lock.json'
      - 'yarn.lock'
      - 'pnpm-lock.yaml'
      - 'requirements.txt'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - 'Pipfile.lock'
      - 'poetry.lock'
      - 'uv.lock'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Gemfile.lock'
      - 'packages.config'
      - 'packages.lock.json'
      - '**/*.csproj'
      - 'framework_deps.txt'

  # Also allow manual runs from the Actions tab
  workflow_dispatch:

jobs:
  oss-trust-check:
    name: Gate 1 — Dependency Trust Check
    runs-on: ubuntu-latest

    # Grant read access to repo contents; write access to post PR comments
    permissions:
      contents: read
      pull-requests: write

    steps:
      # ── 1. Check out the PR branch (the proposed upgrade) ──────────────────
      - name: Checkout PR branch
        uses: actions/checkout@v4   # runs on Node.js 24 (GitHub runner default)

      # ── 2. Set up Python for oss-trust-framework ───────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5   # runs on Node.js 24 (GitHub runner default)
        with:
          python-version: '3.12'        # updated: 3.11 → 3.12 (recommended)
          cache: 'pip'

      # ── 3. Install oss-trust-framework from PyPI ────────────────────────────
      #    Pinned to v0.8.0 so the check version matches the repo version.
      #    Update this pin when you cut a new release.
      - name: Install oss-trust-framework
        run: |
          python -m pip install --upgrade pip
          pip install "oss-trust-framework==0.8.0"

      # ── 4. Detect which manifest files changed in this PR ───────────────────
      - name: Detect changed manifests
        id: manifests
        run: |
          # Build --manifest flags for every changed dependency file
          MANIFESTS=""
          for f in \
            package.json Cargo.toml requirements.txt pyproject.toml \
            Gemfile.lock packages.config Cargo.lock framework_deps.txt; do
            if [ -f "$f" ]; then
              MANIFESTS="$MANIFESTS --manifest $f"
            fi
          done
          echo "flags=$MANIFESTS" >> $GITHUB_OUTPUT
          echo "Manifests to check: $MANIFESTS"

      # ── 5. Run the trust check ─────────────────────────────────────────────
      - name: Run OSS Trust Check
        id: trust_check
        run: |
          # pipefail ensures the exit code comes from oss-trust, not tee.
          # Without set -o pipefail, tee always exits 0 and the failure is lost.
          set -o pipefail
          oss-trust check-all \
            ${{ steps.manifests.outputs.flags }} \
            --no-interactive \
            --output json \
            2>&1 | tee trust_check_output.txt
        continue-on-error: true   # capture exit code below; don't short-circuit

      # ── 6. Post results as a PR comment ────────────────────────────────────
      - name: Post trust check results to PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const raw = fs.readFileSync('trust_check_output.txt', 'utf8');

            // Attempt to parse JSON output for a richer summary table.
            // Fall back to raw text if output isn't valid JSON (e.g. pip error).
            let summary = '';
            let passed = true;
            try {
              const results = JSON.parse(raw);
              const blocked = results.filter(r => r.outcome === 'BLOCKED');
              const held    = results.filter(r => r.outcome === 'HOLD');
              const errors  = results.filter(r => r.outcome === 'ERROR');
              passed = blocked.length === 0 && held.length === 0 && errors.length === 0;

              const rows = results.map(r =>
                `| ${r.ecosystem} | \`${r.package}@${r.version}\` | ${r.outcome} | ${r.gate1_message || ''} |`
              ).join('\n');

              summary = [
                '| Ecosystem | Package | Outcome | Message |',
                '|-----------|---------|---------|---------|',
                rows,
              ].join('\n');
            } catch {
              // Raw text fallback
              passed = !raw.includes('BLOCK') && !raw.includes('HOLD') && !raw.includes('ERROR');
              summary = '```\n' + raw.slice(-3000) + '\n```';
            }

            const icon   = passed ? '✅' : '❌';
            const status = passed ? 'PASSED' : 'ACTION REQUIRED';

            const body = [
              `## ${icon} OSS Trust Framework v0.8.0 — Gate 1 ${status}`,
              '',
              `Checked \`${{ steps.manifests.outputs.flags }}\``,
              '',
              summary,
              '',
              passed
                ? '_All packages cleared the age and allowlist gates. Safe to merge from a supply chain perspective._'
                : '_One or more packages did not pass. Review the flagged packages above before merging._',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      # ── 7. Fail the workflow if trust check failed ─────────────────────────
      #    This blocks PR merge when branch protection requires this check.
      - name: Enforce trust check result
        if: steps.trust_check.outcome == 'failure'
        run: |
          echo "OSS Trust Check failed — see PR comment for details."
          exit 1
