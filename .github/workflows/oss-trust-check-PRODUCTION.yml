name: OSS Trust Check

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'requirements.txt'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - 'Cargo.toml'
      - 'Gemfile.lock'
      - 'packages.config'
      - 'framework_deps.txt'

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  trust-check:
    name: Gate 1 — Dependency Trust Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install oss-trust-framework
        run: |
          pip install -q "oss-trust-framework==0.8.0"

      - name: Run trust check
        id: check
        run: |
          # Find all dependency manifest files
          MANIFESTS=()
          for f in package.json requirements.txt pyproject.toml Cargo.toml Gemfile.lock; do
            [ -f "$f" ] && MANIFESTS+=("--manifest" "$f")
          done
          
          # Run the check and capture output
          set +e
          oss-trust check-all "${MANIFESTS[@]}" --no-interactive --output json > trust_report.json 2>&1
          CHECK_EXIT=$?
          set -e
          
          echo "exit_code=$CHECK_EXIT" >> $GITHUB_OUTPUT
          echo "report_exists=$([ -f trust_report.json ] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT

      - name: Format results as PR comment
        if: always()
        run: |
          # Use the formatter script if it exists in the repo
          if [ -f .github/scripts/format_trust_check.py ]; then
            python .github/scripts/format_trust_check.py trust_report.json > pr_comment.txt || true
          else
            # Fallback: create a simple comment from raw JSON
            if [ -f trust_report.json ]; then
              echo "## 🔍 OSS Trust Check Results" > pr_comment.txt
              echo "" >> pr_comment.txt
              echo "\`\`\`json" >> pr_comment.txt
              cat trust_report.json >> pr_comment.txt
              echo "\`\`\`" >> pr_comment.txt
            else
              echo "# ❌ Trust Check Failed" > pr_comment.txt
              echo "Could not complete dependency trust validation. See logs above." >> pr_comment.txt
            fi
          fi

      - name: Post comment to PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            let comment = '❌ Trust check results unavailable';
            try {
              comment = fs.readFileSync('pr_comment.txt', 'utf8');
            } catch (e) {
              console.log('Could not read comment file:', e.message);
            }
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment,
            });

      - name: Set job status
        if: always()
        run: |
          EXIT_CODE=${{ steps.check.outputs.exit_code }}
          if [ "$EXIT_CODE" = "0" ]; then
            echo "✅ All dependencies approved"
            exit 0
          else
            echo "⚠️ Some dependencies need review (see PR comment)"
            exit 1
          fi
