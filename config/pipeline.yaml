# OSS Trust Framework -- Pipeline Configuration

age_gate:
  hard_block_hours: 24
  hold_hours: 72

trust_scoring:
  min_scorecard_score: 60
  require_zero_active_vulns: true

cicd_audit:
  min_pr_reviewers: 0
  lookback_days: 180
  orphan_commit_trusted_repos:
    - pyca/cryptography
    - yaml/pyyaml
    - Textualize/rich
    - pydantic/pydantic
    - encode/httpx
    - pallets/click
    - psf/requests

zero_day:
  required_approvers: 2
  token_ttl_hours: 6
  circuit_breakers:
    max_exceptions_per_24h: 3
    suspend_on_new_cve_within_days: 30

sandbox:
  runtime: strace
  network: none
  behavioral_patterns:
    block_on_critical: true

trusted_publishers:
  PyPI:
    requests: psf/requests
    cryptography: pyca/cryptography
    httpx: encode/httpx
    pyyaml: yaml/pyyaml
    click: pallets/click
    rich: Textualize/rich
    pydantic: pydantic/pydantic
    pyotp: pyotp/pyotp
    python-dotenv: theskumar/python-dotenv

  npm: {}
  Cargo: {}

  require_attestation:
    PyPI:
      - cryptography
      - httpx
