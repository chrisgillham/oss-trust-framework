# OSS Trust Framework — Pipeline Configuration
# Copy to config/pipeline.yaml and customize for your organization.
# All values can be overridden by environment variables with the prefix OTF_.

age_gate:
  hard_block_hours: 24      # Releases younger than this: auto-blocked (no quorum)
  hold_hours: 72            # Releases in 24–72 h window: hold pending human review
  zero_day_exempt: true     # Zero-day CVE patches bypass age gate only

trust_scoring:
  min_score: 60             # Packages below this score trigger QUARANTINE
  require_zero_vulns: true  # Fail if any active CVE against this exact version
  historical_modifier: true # Apply historical reputation from audit log

slsa:
  # Per-pattern minimum SLSA levels. Patterns are evaluated in order; first match wins.
  critical_packages:
    - pattern: "*auth*"
      min_level: 3
      class: auth
    - pattern: "*jwt*"
      min_level: 3
      class: auth
    - pattern: "*oauth*"
      min_level: 3
      class: auth
    - pattern: "*crypto*"
      min_level: 3
      class: crypto
    - pattern: "*tls*"
      min_level: 3
      class: tls
    - pattern: "*ssl*"
      min_level: 3
      class: tls
    - pattern: "*cert*"
      min_level: 2
      class: tls
    - pattern: "*serializ*"
      min_level: 2
      class: serialization
    - pattern: "*pars*"
      min_level: 2
      class: serialization
  default_min_level: 1              # Applies to packages not matched above
  on_missing_attestation: quarantine  # quarantine | hold | warn
  on_below_minimum: quarantine

reachability:
  enabled: true
  adapter: endor_labs             # endor_labs | snyk | contrast | none
  cache_ttl_hours: 24             # Rebuild call graph if stale
  on_unreachable: hold            # Downgrade QUARANTINE → HOLD when not reachable
  on_adapter_failure: quarantine  # Fail behavior if adapter unavailable
  adapter_config:
    endor_labs:
      api_key_env: ENDOR_LABS_API_KEY
      project_uuid_env: ENDOR_LABS_PROJECT_UUID
    snyk:
      token_env: SNYK_TOKEN
      org_id_env: SNYK_ORG_ID

license:
  allowlist:
    - MIT
    - Apache-2.0
    - BSD-2-Clause
    - BSD-3-Clause
    - ISC
    - 0BSD
    - Unlicense
    - CC0-1.0
    - MPL-2.0          # Weak copyleft — file-level only; generally acceptable
  warn_on_change: true           # Notify even if new license is on allowlist
  block_copyleft: true           # GPL-2.0, GPL-3.0, AGPL-3.0, LGPL-2.1, LGPL-3.0
  block_commercial_restrict: true  # Commons Clause, SSPL, BSL, BUSL
  on_unlicensed: block           # No SPDX identifier found → block
  on_allowlist_violation: quarantine

sbom:
  recursive: true                     # Evaluate full transitive tree
  max_transitive_depth: 10            # Recursion limit
  new_transitive_action: quarantine   # quarantine | hold | block
  min_transitive_trust_score: 50      # Transitive packages below this fail the parent
  hash_algorithm: sha256              # sha256 | sha512

sandbox:
  runtime: gvisor                # gvisor | firecracker | docker
  network: none                  # none | loopback | restricted
  timeout_seconds: 120
  memory_limit_mb: 512
  cpu_shares: 512
  blocked_syscalls:              # Additional syscall denials beyond gVisor defaults
    - ptrace
    - process_vm_readv
    - process_vm_writev

ai_hallucination:
  enabled: true
  hallucination_registry_url: https://api.oss-trust.dev/hallucinations
  registry_cache_ttl_hours: 6
  similarity_threshold: 0.85     # Name similarity to known packages triggers flag
  new_package_age_days: 90       # Flag packages newer than this with no download history
  min_download_count: 100        # Flag packages with fewer downloads than this
  on_confirmed_hallucination: block
  on_suspected: quarantine

cicd_audit:
  enabled: true
  require_sha_pinning: true           # Flag any action not pinned to a commit SHA
  new_action_action: hold             # hold | quarantine for new third-party actions
  approved_action_inventory: .github/approved-actions.json
  flag_pull_request_target: true      # Flag pull_request_target with write perms
  flag_script_injection: true         # Flag ${{ github.event.* }} in run: steps

zero_day:
  required_approvers: 2          # Minimum quorum for expedited lane
  token_ttl_hours: 6             # Exception token expiry
  max_exceptions_per_24h: 3      # Circuit breaker
  require_mfa: true              # Approvers must have MFA on their GitHub account
  require_ticket: true           # SIEM audit record must include ticket/issue link
  cve_sources_required: 2        # CVE must appear in at least N of: NVD, OSV, GHSA

runtime:
  monitoring_window_days: 30
  siem_hec_endpoint: "${SIEM_HEC_ENDPOINT}"
  siem_hec_token: "${SIEM_HEC_TOKEN}"
  anomaly_webhook: "${ANOMALY_WEBHOOK_URL}"
  elevated_alert_hours: 48       # Heightened monitoring window after zero-day deploy
  rollback:
    enabled: true
    adapter: helm                 # helm | ansible | terraform | kubectl | custom
    on_unanimous_revocation: auto_rollback
    rollback_timeout_minutes: 15
    dry_run: false

public_registry:
  enabled: false                 # Opt-in — set to true to participate
  endpoint: https://api.oss-trust.dev/registry
  api_key_env: PUBLIC_REGISTRY_API_KEY
  contribute_verdicts: true
  contribute_signal_flags: true
  consume_community_scores: true
  community_score_weight: 0.15   # Weight of community score in final trust modifier

out_of_band_trust:
  sources:
    - name: openssf_scorecard
      url: https://api.securityscorecards.dev
      weight: 0.30
    - name: osv
      url: https://api.osv.dev
      weight: 0.25
    - name: deps_dev
      url: https://api.deps.dev
      weight: 0.20
    - name: github_advisories
      url: https://api.github.com/advisories
      weight: 0.15
    - name: socket
      url: https://api.socket.dev/v0
      api_key_env: SOCKET_API_KEY
      weight: 0.10
