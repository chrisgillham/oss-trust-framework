# OSS Trust Framework — Pipeline Configuration
# config/pipeline.yaml

age_gate:
  hard_block_hours: 24
  hold_hours: 72

trust_scoring:
  min_scorecard_score: 60
  require_zero_active_vulns: true

cicd_audit:
  min_pr_reviewers: 0        # Many trusted projects merge maintainer PRs without separate reviewer
  lookback_days: 180         # Only check orphan commits on tags newer than 180 days

  # Repos where orphan commits are expected due to their release workflow.
  # These are well-established projects audited by the Python security community.
  # Gate 2.5a is still active — only skipped for the specific tags matching
  # the current version being validated.
  orphan_commit_trusted_repos:
    - pyca/cryptography       # Uses release branch strategy — some tags off main
    - yaml/pyyaml             # Uses direct tagging workflow
    - Textualize/rich         # Uses automated release workflow

  # Repos that legitimately use id-token:write with environment protection
  # (PyPI Trusted Publishing) — workflow_permissions audit passes automatically
  trusted_publishing_repos:
    - pyca/cryptography
    - Textualize/rich
    - yaml/pyyaml
    - pallets/click
    - encode/httpx
    - pydantic/pydantic
    - yaml/pyyaml

zero_day:
  required_approvers: 2
  token_ttl_hours: 6
  circuit_breakers:
    max_exceptions_per_24h: 3
    suspend_on_new_cve_within_days: 30

sandbox:
  runtime: strace
  network: none
  behavioral_patterns:
    block_on_critical: true

trusted_publishers:
  PyPI:
    requests: psf/requests
    cryptography: pyca/cryptography
    httpx: encode/httpx
    pyyaml: yaml/pyyaml
    click: pallets/click
    rich: Textualize/rich
    pydantic: pydantic/pydantic
    pyotp: pyotp/pyotp
    python-dotenv: theskumar/python-dotenv

  npm: {}
  Cargo: {}

  require_attestation:
    PyPI:
      - cryptography
      - httpx
