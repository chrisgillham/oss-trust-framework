  "clap": "clap-rs/clap"
  "anyhow": "dtolnay/anyhow"
  "thiserror": "dtolnay/thiserror"
  "tracing": "tokio-rs/tracing"
  "log": "rust-lang/log"
  "rand": "rust-random/rand"
  "chrono": "chronotope/chrono"
  "regex": "rust-lang/regex"
  "uuid": "uuid-rs/uuid"
  "sqlx": "launchbadge/sqlx"

