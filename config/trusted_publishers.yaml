# Trusted publisher allowlist
# Maps package names to their canonical GitHub source repository.
#
# Used by Gate 2 (provenance attestation) to verify that a package was
# published from the expected org repo — not a fork or compromised employee
# account. Any provenance attestation pointing to a different repo is an
# immediate BLOCK.
#
# Format:
#   ecosystem:
#     "package-name": "owner/repo"
#
# How to add a new package:
#   pypi:  curl -s https://pypi.org/pypi/<pkg>/json | python3 -c "import sys,json; d=json.load(sys.stdin); print((d['info'].get('project_urls') or {}))"
#   npm:   npm view <pkg> repository.url
#   cargo: cargo search <crate>  (then verify at crates.io/crates/<crate>)
#   go:    module path IS the canonical repo path (github.com/owner/repo)
#   maven: groupId:artifactId — verify at search.maven.org
#   nuget: nuget.org/packages/<id>
#   gems:  rubygems.org/gems/<name>
#
# Priority order for what to add:
#   1. Packages with network access
#   2. Packages that handle crypto or auth
#   3. Packages that read/write files or env vars
#   4. All direct dependencies in pyproject.toml / package.json / Cargo.toml etc.
#   5. High-value transitive dependencies
#
# Last verified: 2026-06-13

# ---------------------------------------------------------------------------
# PyPI (Python)
# ---------------------------------------------------------------------------
PyPI:

  # --- Network / HTTP ---
  "httpx": "encode/httpx"               # Async HTTP client — network access
  "requests": "psf/requests"
  "urllib3": "urllib3/urllib3"
  "aiohttp": "aio-libs/aiohttp"

  # --- Cryptography / Auth ---
  "cryptography": "pyca/cryptography"   # Core crypto primitives — CRITICAL
  "pyotp": "pyotp/pyotp"               # TOTP/MFA — used in zero-day quorum
  "PyJWT": "jpadilla/pyjwt"
  "paramiko": "paramiko/paramiko"
  "bcrypt": "pyca/bcrypt"

  # --- Config / Environment ---
  "python-dotenv": "theskumar/python-dotenv"
  "pyyaml": "yaml/pyyaml"
  "toml": "uiri/toml"

  # --- CLI / Output ---
  "click": "pallets/click"
  "rich": "Textualize/rich"
  "typer": "tiangolo/typer"

  # --- Data validation ---
  "pydantic": "pydantic/pydantic"

  # --- Dev / Test dependencies ---
  "pytest": "pytest-dev/pytest"
  "pytest-asyncio": "pytest-dev/pytest-asyncio"
  "pytest-cov": "pytest-dev/pytest-cov"
  "respx": "lundberg/respx"
  "ruff": "astral-sh/ruff"
  "mypy": "python/mypy"

  # --- High-value ecosystem packages ---
  "flask": "pallets/flask"
  "django": "django/django"
  "fastapi": "tiangolo/fastapi"
  "sqlalchemy": "sqlalchemy/sqlalchemy"
  "celery": "celery/celery"
  "boto3": "boto/boto3"
  "google-cloud-storage": "googleapis/python-storage"
  "azure-storage-blob": "Azure/azure-sdk-for-python"

# ---------------------------------------------------------------------------
# npm (Node.js / JavaScript / TypeScript)
# Verified via: npm view <pkg> repository.url
# ---------------------------------------------------------------------------
npm:
  # --- HTTP / networking ---
  "axios": "axios/axios"
  "node-fetch": "node-fetch/node-fetch"
  "got": "sindresorhus/got"
  "undici": "nodejs/undici"

  # --- Auth / crypto ---
  "jsonwebtoken": "auth0/node-jsonwebtoken"
  "bcrypt": "kelektiv/node.bcrypt.js"
  "crypto-js": "brix/crypto-js"
  "jose": "panva/jose"

  # --- Config / env ---
  "dotenv": "motdotla/dotenv"
  "js-yaml": "nodeca/js-yaml"

  # --- Build tooling (high-value CI targets — ref: IronWorm, Shai-Hulud) ---
  "typescript": "microsoft/TypeScript"
  "esbuild": "evanw/esbuild"
  "vite": "vitejs/vite"
  "webpack": "webpack/webpack"
  "rollup": "rollup/rollup"
  "turbo": "vercel/turbo"
  "@babel/core": "babel/babel"

  # --- Package managers / publishing ---
  "npm": "npm/cli"
  "pnpm": "pnpm/pnpm"
  "yarn": "yarnpkg/berry"

  # --- Frameworks ---
  "express": "expressjs/express"
  "fastify": "fastify/fastify"
  "next": "vercel/next.js"
  "react": "facebook/react"
  "vue": "vuejs/core"

  # --- Testing ---
  "jest": "jestjs/jest"
  "vitest": "vitest-dev/vitest"
  "mocha": "mochajs/mocha"

  # --- Arweave/WeaveDB ecosystem (IronWorm attack surface, June 2026) ---
  "weavedb-sdk": "weavedb/weavedb"
  "wao": "weavedb/wao"
  "arweave": "ArweaveTeam/arweave-js"

