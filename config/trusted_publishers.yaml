  "rspec": "rspec/rspec"
  "rubocop": "rubocop/rubocop"
  "jwt": "jwt/ruby-jwt"
  "bcrypt": "bcrypt-ruby/bcrypt-ruby"
  "dotenv": "bkeepers/dotenv"
  "sidekiq": "sidekiq/sidekiq"
  "puma": "puma/puma"

# ---------------------------------------------------------------------------
# Provenance attestation required (auto-BLOCK if absent for listed packages)
# ---------------------------------------------------------------------------
require_attestation:
  PyPI:
    - cryptography
    - httpx
    - requests
    - PyJWT
  npm:
    - axios
    - jsonwebtoken
    - jose
    - typescript
    - esbuild
    - vite
    - webpack
  Cargo:
    - serde
    - tokio
    - reqwest
    - rustls
    - ring
