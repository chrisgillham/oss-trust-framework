[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oss-trust-framework"
version = "0.6.1"
description = "Multi-gate open source supply chain trust validation pipeline with zero-day expedited lane"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["supply-chain", "security", "open-source", "sbom", "zero-day", "sigstore"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "httpx>=0.27.2",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.2.2",   # <1.2.2 vulnerable: symlink following in set_key (arbitrary file overwrite)
    "click>=8.1.8",
    "pydantic>=2.9.2",
    "pyotp>=2.9.0",
    "cryptography>=46.0.5",   # <46.0.5 vulnerable: SECT curve subgroup attack + DNS name constraint bypass
                              # <46.0.5 vulnerable: incomplete DNS name constraint enforcement
                              # <46.0.6 patched for all three; 44.0.1 covers the OpenSSL wheel issues
    "rich>=13.9.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
oss-trust = "oss_trust_framework.cli:main"
oss-trust-check-all = "oss_trust_framework.check_all:check_all_command"

[tool.hatch.build.targets.wheel]
packages = ["oss_trust_framework"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "S", "B"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
