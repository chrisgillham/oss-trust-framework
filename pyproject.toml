[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "oss-trust-framework"
version = "2.0.0"
description = "Multi-gate OSS supply chain trust validation pipeline with runtime telemetry"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Chris Gillham" }]
requires-python = ">=3.11"

dependencies = [
    # HTTP
    "httpx>=0.27",
    "aiohttp>=3.9",
    # Data
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "toml>=0.10",
    # Cryptography / signing
    "sigstore>=3.0",
    "cryptography>=42.0",
    "in-toto>=2.0",
    # SBOM
    "cyclonedx-python-lib>=7.0",
    # SPDX / license
    "spdx-tools>=0.8",
    # CLI
    "click>=8.1",
    "rich>=13.7",
    # Async
    "anyio>=4.3",
    # Fuzzy matching (typosquatting / AI hallucination)
    "rapidfuzz>=3.6",
    # Caching
    "diskcache>=5.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "ruff>=0.4",
    "mypy>=1.9",
    "coverage[toml]>=7.4",
]
reachability-endor = ["endor-labs-sdk>=0.5"]
reachability-snyk  = ["snyk>=2.0"]

[project.scripts]
oss-trust = "oss_trust.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
branch = true
