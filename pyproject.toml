[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oss-trust-framework"
version = "0.3.0"
description = "Multi-gate open source supply chain trust validation pipeline with zero-day expedited lane"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["supply-chain", "security", "open-source", "sbom", "zero-day", "sigstore"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "click>=8.1",
    "pydantic>=2.0",
    "pyotp>=2.9",
    "cryptography>=42.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
oss-trust = "oss_trust_framework.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["oss_trust_framework"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "S", "B"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
